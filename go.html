<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening Amazon… | DealsGenie USA</title>
<meta name="robots" content="noindex">
<script defer src="/analytics.js"></script>
<style>
:root{--bg:#0d0a24;--card:#181240;--text:#f5f3ff;--muted:#a79fd6;--gold:#ffc83d;--border:#2e2663;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f4f1ff;--card:#fff;--text:#1b1440;--muted:#5b4fa0;--gold:#d97706;--border:#ddd6ff;color-scheme:light}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;box-sizing:border-box}
.box{max-width:420px;width:100%;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:28px 20px;text-align:center}
.logo{font-weight:900;font-size:1.4rem}.logo b{color:var(--gold)}
h1{font-size:1.2rem;margin:16px 0 8px}
p{color:var(--muted);font-size:.9rem;line-height:1.5;margin:8px 0}
.btn{display:inline-block;margin:14px 0 6px;background:var(--gold);color:#1b1440;font-weight:800;text-decoration:none;padding:13px 26px;border-radius:99px}
a{color:var(--gold)}
</style>
</head>
<body>
<div class="box">
<div class="logo">🧞 Deals<b>Genie</b></div>
<h1 id="h">Taking you to Amazon…</h1>
<p id="m">Opening your deal on Amazon.com. If nothing happens, tap the button.</p>
<a id="go" class="btn" href="/">Open on Amazon</a>
<p>As an Amazon Associate I earn from qualifying purchases.</p>
<p><a href="/">See more deals on DealsGenie</a></p>
</div>
<script>
var a=(new URLSearchParams(location.search).get('a')||'').toUpperCase();
var ok=/^[A-Z0-9]{10}$/.test(a);
var url=ok?'https://www.amazon.com/dp/'+a+'?tag=dealsgenie203-20':'/';
document.getElementById('go').href=url;
if(ok){setTimeout(function(){location.replace(url)},1200)}
else{document.getElementById('h').textContent='Deal link not found';document.getElementById('m').textContent='Tap below to see all of today\u2019s deals.'}
</script>
</body>
</html>
